name: AniFuze CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install --include=dev
      - name: Ensure TypeScript React types
        run: npm install --save-dev @types/react@18.3.12 @types/react-dom@18.3.1
        working-directory: system
        working-directory: system

      - name: Build frontend
        run: npm run build
        working-directory: system

      - name: Server tests
        run: npm run test:server
        working-directory: system
